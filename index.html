<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
</head>
<body>
     <main class="app">
    <h1>To-Do App</h1>

    <form id="todoForm">
      <input
        type="text"
        id="todoInput"
        placeholder="Add a new task..."
        autocomplete="off"
      />
      <button type="submit">Add</button>
    </form>

    <ul id="todoList"></ul>
  </main>
    <script src="script.js"></script>
</body>
</html>
